name: Cloudflare Proxy Emergency Recovery

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/emergency-cloudflare-proxy-recovery.yml"

jobs:
  recover:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: "04753403d3299a1dd586273617329b63"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2

      - name: Upload known-good proxy version
        id: upload
        working-directory: ops/corepartners-proxy
        run: |
          set -o pipefail
          bunx wrangler versions upload --config wrangler.jsonc 2>&1 | tee /tmp/proxy-upload.log
          VERSION_ID=$(grep -Eo 'Worker Version ID: [0-9a-f-]+' /tmp/proxy-upload.log | awk '{print $4}' | tail -1)
          if [ -z "$VERSION_ID" ]; then
            echo "::error::Could not parse proxy Worker Version ID"
            cat /tmp/proxy-upload.log
            exit 1
          fi
          echo "version_id=$VERSION_ID" >> "$GITHUB_OUTPUT"
          echo "Uploaded proxy version: $VERSION_ID"

      - name: Deploy proxy version to 100 percent
        working-directory: ops/corepartners-proxy
        run: |
          bunx wrangler versions deploy "${{ steps.upload.outputs.version_id }}@100%" --name corepartners-proxy -y --message "Emergency restore known-good proxy code from 2026-07-30 backup"

      - name: Verify public site
        run: |
          sleep 3
          for URL in https://corepartners.kr/ https://corepartners.kr/coupang-plus https://corepartners.kr/center https://corepartners.kr/robots.txt https://corepartners.kr/sitemap.xml; do
            CODE=$(curl -L -sS -o /tmp/body -w "%{http_code}" "$URL")
            echo "$URL -> $CODE"
            test "$CODE" = "200"
          done
