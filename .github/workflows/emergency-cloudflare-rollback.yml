name: Cloudflare Emergency Rollback

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/emergency-cloudflare-rollback.yml"

jobs:
  rollback:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: "04753403d3299a1dd586273617329b63"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: oven-sh/setup-bun@v2
      - name: Roll back corepartners
        run: bunx wrangler rollback 2dc21add-de94-432c-92db-36c93eb2be77 --name corepartners --message "Emergency rollback after 2026-09-21 SEO deploy smoke-test failure"
      - name: Verify site
        run: |
          sleep 3
          for URL in https://corepartners.kr/ https://corepartners.kr/coupang-plus https://corepartners.kr/center https://corepartners.kr/robots.txt https://corepartners.kr/sitemap.xml; do
            CODE=$(curl -L -sS -o /tmp/body -w "%{http_code}" "$URL")
            echo "$URL -> $CODE"
            test "$CODE" = "200"
          done
