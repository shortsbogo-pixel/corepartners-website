name: Cloudflare Proxy Next Preview

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/corepartners-proxy-next-preview.yml"

jobs:
  preview:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: "04753403d3299a1dd586273617329b63"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2

      - name: Upload proxy candidate
        id: upload
        working-directory: ops/corepartners-proxy-next
        run: |
          set -o pipefail
          bunx wrangler versions upload --config wrangler.jsonc --preview-alias seo-next 2>&1 | tee /tmp/proxy-next-upload.log
          PREVIEW_URL=$(grep -Eo 'https://[a-z0-9-]+-corepartners-proxy\.[a-z0-9-]+\.workers\.dev' /tmp/proxy-next-upload.log | tail -1 || true)
          if [ -z "$PREVIEW_URL" ]; then
            PREVIEW_URL="https://seo-next-corepartners-proxy.shortsbogo.workers.dev"
          fi
          echo "url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"
          echo "Proxy preview: $PREVIEW_URL"

      - name: Smoke test candidate proxy
        run: |
          URL="${{ steps.upload.outputs.url }}"
          sleep 2
          for PATHNAME in / /coupang-plus /center /rent /robots.txt /sitemap.xml /api/chat; do
            CODE=$(curl -L -sS -o /tmp/body -w "%{http_code}" "$URL$PATHNAME")
            echo "$PATHNAME -> $CODE"
            test "$CODE" = "200"
          done
          curl -fsSL "$URL/coupang-plus" -o /tmp/coupang.html
          grep -Fq "28만 2천원" /tmp/coupang.html
          grep -Fq "해당 주 금요일에 지급" /tmp/coupang.html
          curl -fsSL "$URL/rent" -o /tmp/rent.html
          grep -Fq "대전 배달 오토바이" /tmp/rent.html
          curl -fsSL "$URL/robots.txt" -o /tmp/robots.txt
          grep -Fq "OAI-SearchBot" /tmp/robots.txt
          curl -fsSL "$URL/api/chat" -o /tmp/chat.json
          grep -Fq '"enabled":true' /tmp/chat.json
