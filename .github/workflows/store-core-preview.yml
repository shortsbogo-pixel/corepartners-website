name: Cloudflare Store Core Preview

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/store-core-preview.yml"

jobs:
  preview:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: "04753403d3299a1dd586273617329b63"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Build
        run: bun run build
      - name: Upload preview version
        id: upload
        run: |
          set -o pipefail
          bunx wrangler versions upload --name corepartners --preview-alias store-next --keep-vars 2>&1 | tee /tmp/store-core.log
          VERSION_ID=$(grep -Eo 'Worker Version ID: [0-9a-f-]+' /tmp/store-core.log | awk '{print $4}' | tail -1)
          PREVIEW_URL=$(grep -Eo 'https://store-next-corepartners\.[a-z0-9-]+\.workers\.dev' /tmp/store-core.log | tail -1)
          test -n "$VERSION_ID"
          test -n "$PREVIEW_URL"
          echo "version_id=$VERSION_ID" >> "$GITHUB_OUTPUT"
          echo "url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"
          echo "Version $VERSION_ID"
          echo "Preview $PREVIEW_URL"
      - name: Smoke test preview
        run: |
          URL="${{ steps.upload.outputs.url }}"
          for PATHNAME in / /coupang-plus /center /rent /docs /store /llms.txt /robots.txt /sitemap.xml /api/chat; do
            CODE=$(curl -L -sS -o /tmp/body -w "%{http_code}" "$URL$PATHNAME")
            echo "$PATHNAME -> $CODE"
            test "$CODE" = "200"
          done
          curl -fsSL "$URL/store" -o /tmp/store.html
          grep -Fq "대전 배달대행·가맹점 입점 상담" /tmp/store.html
          grep -Fq "바로고 B2B" /tmp/store.html
          grep -Fq '"FAQPage"' /tmp/store.html
          curl -fsSL "$URL/sitemap.xml" -o /tmp/sitemap.xml
          grep -Fq "https://corepartners.kr/store" /tmp/sitemap.xml
          curl -fsSL "$URL/llms.txt" -o /tmp/llms.txt
          grep -Fq "Store delivery agency: https://corepartners.kr/store" /tmp/llms.txt
          curl -fsSL "$URL/" -o /tmp/home.html
          grep -Fq 'href="/store"' /tmp/home.html
          curl -fsSL "$URL/api/chat" -o /tmp/chat.json
          grep -Fq '"enabled":true' /tmp/chat.json
