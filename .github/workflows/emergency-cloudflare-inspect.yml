name: Cloudflare Emergency Inspect

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/emergency-cloudflare-inspect.yml"

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: "04753403d3299a1dd586273617329b63"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: oven-sh/setup-bun@v2
      - name: List deployments
        run: bunx wrangler deployments list --name corepartners --json
      - name: List versions
        run: bunx wrangler versions list --name corepartners --json
