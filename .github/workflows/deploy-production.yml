name: Cloudflare Production Deploy

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-production.yml"
  workflow_dispatch:

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: "04753403d3299a1dd586273617329b63"
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Check Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN repository secret is not configured"
            exit 1
          fi

      - name: Verify existing Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          bunx wrangler deployments list --name corepartners >/tmp/deployments.txt
          test -s /tmp/deployments.txt

      - name: Deploy production version
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bunx wrangler deploy --name corepartners --keep-vars

      - name: Smoke test production
        run: |
          for URL in https://corepartners.kr/ https://corepartners.kr/coupang-plus https://corepartners.kr/center https://corepartners.kr/rent https://corepartners.kr/robots.txt https://corepartners.kr/sitemap.xml; do
            CODE=$(curl -L -sS -o /tmp/body -w "%{http_code}" "$URL")
            echo "$URL -> $CODE"
            test "$CODE" = "200"
          done
          curl -fsSL https://corepartners.kr/coupang-plus | grep -q "28만 2천원"
          curl -fsSL https://corepartners.kr/rent | grep -q "대전 배달 오토바이"
          curl -fsSL https://corepartners.kr/robots.txt | grep -q "OAI-SearchBot"
