name: Cloudflare Proxy Zero Traffic Smoke

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/corepartners-proxy-zero-smoke.yml"

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: "04753403d3299a1dd586273617329b63"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      STABLE_VERSION: "464b7ae1-fb0c-40c7-9bc9-dd6a5fc7a3bc"
      CANDIDATE_VERSION: "011ba375-6f91-473b-80e5-fc45db1122e0"
    steps:
      - uses: oven-sh/setup-bun@v2

      - name: Add candidate at zero traffic
        run: |
          bunx wrangler versions deploy "${STABLE_VERSION}@100%" "${CANDIDATE_VERSION}@0%" --name corepartners-proxy -y --message "SEO/GEO candidate smoke test at 0 percent"

      - name: Smoke test candidate with version override
        run: |
          sleep 2
          HEADER="Cloudflare-Workers-Version-Overrides: corepartners-proxy=\"${CANDIDATE_VERSION}\""
          for PATHNAME in / /coupang-plus /center /rent /robots.txt /sitemap.xml /api/chat; do
            CODE=$(curl -L -sS -H "$HEADER" -o /tmp/body -w "%{http_code}" "https://corepartners.kr$PATHNAME")
            echo "$PATHNAME -> $CODE"
            test "$CODE" = "200"
          done
          curl -fsSL -H "$HEADER" https://corepartners.kr/coupang-plus -o /tmp/coupang.html
          grep -Fq "28만 2천원" /tmp/coupang.html
          grep -Fq "해당 주 금요일에 지급" /tmp/coupang.html
          curl -fsSL -H "$HEADER" https://corepartners.kr/rent -o /tmp/rent.html
          grep -Fq "대전 배달 오토바이" /tmp/rent.html
          curl -fsSL -H "$HEADER" https://corepartners.kr/robots.txt -o /tmp/robots.txt
          grep -Fq "OAI-SearchBot" /tmp/robots.txt
          curl -fsSL -H "$HEADER" https://corepartners.kr/api/chat -o /tmp/chat.json
          grep -Fq '"enabled":true' /tmp/chat.json
